<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gpro パスキー登録テスト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #172338;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }
    button {
      font-size: 20px;
      padding: 18px 28px;
      border: 0;
      border-radius: 12px;
      background: #80caff;
      color: #102030;
    }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 24px; line-height: 1.8; }
  </style>
  <script src="https://unpkg.com/@simplewebauthn/browser@14.0.0/dist/bundle/index.umd.min.js"></script>
</head>
<body>
  <h1>Gpro パスキー体験</h1>
  <p>実際にパスキーを登録してみましょう。</p>
  <button id="register">パスキーを登録</button>
  <p id="status">登録ボタンを押してください。</p>

  <script>
    const API = 'https://passkey-api.gpro-security.workers.dev';
    const button = document.getElementById('register');
    const status = document.getElementById('status');

    let prepared = null;

    // ページを開いた時点で登録情報を取得
    async function prepareRegistration() {
      button.disabled = true;
      status.textContent = 'パスキー登録の準備中です...';

      try {
        const res = await fetch(API + '/register/options', {
          method: 'POST',
          cache: 'no-store'
        });

        if (!res.ok) {
          throw new Error('登録準備API: HTTP ' + res.status);
        }

        prepared = await res.json();

        status.textContent =
          '準備完了！ ボタンを押してください。';
        button.textContent = 'パスキーを登録';
      } catch (error) {
        prepared = null;
        status.textContent = '準備エラー: ' + error.message;
        button.textContent = '準備を再試行';
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', async () => {
      if (!prepared) {
        await prepareRegistration();
        return;
      }

      const { registrationId, options } = prepared;
      prepared = null;

      button.disabled = true;
      status.textContent = 'パスキー作成を開始しています...';

      try {
        // Safari対策：クリック直後に呼ぶ
        // この前にawaitで通信しない
        const registrationPromise =
          SimpleWebAuthnBrowser.startRegistration({
            optionsJSON: options
          });

        const credential = await registrationPromise;

        status.textContent = 'サーバーで検証しています...';

        const response = await fetch(API + '/register/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            registrationId,
            response: credential
          })
        });

        const result = await response.json();

        if (!response.ok || !result.verified) {
          throw new Error(result.error || '検証に失敗しました');
        }

        status.textContent =
          '✅ パスキーの登録と検証に成功しました！';

      } catch (error) {
        status.textContent =
          '❌ ' + (error.name || 'Error') +
          ': ' + error.message;
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = 'もう一度登録';
      }
    });

    prepareRegistration();
  </script>

<div style="margin-top:32px">
  <button id="login-button" disabled>ログイン準備中...</button>
  <p id="login-status">準備中...</p>
</div>

<script>
(() => {
  const loginAPI = 'https://passkey-api.gpro-security.workers.dev';
  const loginButton = document.getElementById('login-button');
  const loginStatus = document.getElementById('login-status');

  let loginPrepared = null;
  let loginPreparedAt = 0;

  async function prepareLogin() {
    loginButton.disabled = true;
    loginStatus.textContent = 'ログインの準備中...';

    try {
      const res = await fetch(loginAPI + '/login/options', {
        method: 'POST',
        cache: 'no-store'
      });

      if (!res.ok) {
        throw new Error('ログイン準備API: HTTP ' + res.status);
      }

      loginPrepared = await res.json();
      loginPreparedAt = Date.now();

      loginButton.textContent = 'パスキーでログイン';
      loginStatus.textContent = 'ログイン準備完了';
    } catch (error) {
      loginPrepared = null;
      loginButton.textContent = '準備を再試行';
      loginStatus.textContent = '準備エラー: ' + error.message;
    } finally {
      loginButton.disabled = false;
    }
  }

  loginButton.addEventListener('click', async () => {
    // サーバー側の有効期限は5分
    if (!loginPrepared ||
        Date.now() - loginPreparedAt > 240000) {
      await prepareLogin();
      return;
    }

    const { loginId, options } = loginPrepared;
    loginPrepared = null;
    loginButton.disabled = true;

    try {
      loginStatus.textContent = 'パスキー認証を開始します...';

      // Safari対策：タップ直後に認証を開始
      const credentialPromise =
        SimpleWebAuthnBrowser.startAuthentication({
          optionsJSON: options
        });

      const credential = await credentialPromise;

      loginStatus.textContent = 'サーバーで認証結果を検証中...';

      const res = await fetch(loginAPI + '/login/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          loginId,
          response: credential
        })
      });

      const result = await res.json();

      if (!res.ok || !result.verified) {
        throw new Error(result.error || '認証に失敗しました');
      }

      loginStatus.textContent =
        '登録済みパスキーでログイン成功！';
      loginButton.textContent = '認証成功';

    } catch (error) {
      loginStatus.textContent =
        '❌ ' + (error.name || 'Error') +
        ': ' + error.message;

      loginButton.textContent = 'ログインを再試行';
      loginButton.disabled = false;
      console.error(error);
    }
  });

  prepareLogin();
})();
</script>

</body>
</html>
